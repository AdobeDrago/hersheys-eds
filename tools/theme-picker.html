<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Themes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/tools/theme-picker/theme-picker.css">
    <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
    <script src="/tools/theme-picker/theme-picker.js" type="module"></script>
  </head>
  <body>
    <main class="theme-picker">
      <div class="theme-picker-dropdown">
        <button type="button" class="theme-picker-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Theme">Loading…</button>
        <ul class="theme-picker-menu" role="listbox" aria-label="Themes" hidden></ul>
      </div>
      <p class="theme-picker-current">Current: <span class="theme-picker-current-value">…</span></p>
      <p class="theme-picker-status" role="status"></p>
    </main>
  </body>
</html>
